<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>US Elections 2026</title>
<style>
:root{--bg:#F4F1EA;--card:#FBF9F4;--tx:#22252A;--tx2:#7A7E85;--bd:#D9D4C8;--D:#3D6BA8;--R:#B5473F;--vazio:#E6E1D6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}h1{font-size:1.5rem;margin:.2em 0 .4em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.casa .n{font-size:2.2rem;font-weight:600}.lbl{font-size:.95rem;color:var(--tx2)}
.barra{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--vazio);margin-top:6px;position:relative}.barra .m{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--tx2)}
.d{color:var(--D)}.r{color:var(--R)}.tabs button{font:inherit;padding:6px 14px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--tx);color:var(--bg)}svg{width:100%;height:auto;display:block;margin-top:8px}#dica{min-height:1.4em;font-size:.95rem;color:var(--tx2)}
.prev p{margin:.3em 0}footer{font-size:.8rem;color:var(--tx2);display:flex;justify-content:space-between;padding:4px 2px}a{color:inherit}
</style></head><body><main>
<h1>US Elections 2026</h1>
<section class="card"><div class="grid" id="bancada"></div></section>
<section class="card"><div class="tabs"><button id="bs" class="on">Senate</button> <button id="bc">House</button></div><svg id="mapa" viewBox="0 0 1100 800" role="img" aria-label="US map"></svg><div id="dica"></div></section>
<section class="card prev" id="previsao"></section>
<footer><span>Source: <a href="https://civicapi.org" target="_blank" rel="noopener">civicapi.org</a></span><span id="hora"></span></footer>
</main><script>
const TILES={AK:[0,0,"Alaska"],ME:[10,0,"Maine"],WI:[5,1,"Wisconsin"],VT:[9,1,"Vermont"],NH:[10,1,"New Hampshire"],WA:[0,2,"Washington"],ID:[1,2,"Idaho"],MT:[2,2,"Montana"],ND:[3,2,"North Dakota"],MN:[4,2,"Minnesota"],IL:[5,2,"Illinois"],MI:[6,2,"Michigan"],NY:[8,2,"New York"],MA:[9,2,"Massachusetts"],OR:[0,3,"Oregon"],NV:[1,3,"Nevada"],WY:[2,3,"Wyoming"],SD:[3,3,"South Dakota"],IA:[4,3,"Iowa"],IN:[5,3,"Indiana"],OH:[6,3,"Ohio"],PA:[7,3,"Pennsylvania"],NJ:[8,3,"New Jersey"],CT:[9,3,"Connecticut"],RI:[10,3,"Rhode Island"],CA:[0,4,"California"],UT:[1,4,"Utah"],CO:[2,4,"Colorado"],NE:[3,4,"Nebraska"],MO:[4,4,"Missouri"],KY:[5,4,"Kentucky"],WV:[6,4,"West Virginia"],VA:[7,4,"Virginia"],MD:[8,4,"Maryland"],DE:[9,4,"Delaware"],AZ:[1,5,"Arizona"],NM:[2,5,"New Mexico"],KS:[3,5,"Kansas"],AR:[4,5,"Arkansas"],TN:[5,5,"Tennessee"],NC:[6,5,"North Carolina"],SC:[7,5,"South Carolina"],DC:[8,5,"District of Columbia"],OK:[3,6,"Oklahoma"],LA:[4,6,"Louisiana"],MS:[5,6,"Mississippi"],AL:[6,6,"Alabama"],GA:[7,6,"Georgia"],HI:[0,7,"Hawaii"],TX:[3,7,"Texas"],FL:[8,7,"Florida"]};
const CADEIRAS={AL:7,AK:1,AZ:9,AR:4,CA:52,CO:8,CT:5,DE:1,FL:28,GA:14,HI:2,ID:2,IL:17,IN:9,IA:4,KS:4,KY:6,LA:6,ME:2,MD:8,MA:9,MI:13,MN:8,MS:4,MO:8,MT:2,NE:3,NV:4,NH:2,NJ:12,NM:3,NY:26,NC:14,ND:1,OH:15,OK:5,OR:6,PA:17,RI:2,SC:7,SD:1,TN:9,TX:38,UT:4,VT:1,VA:11,WA:10,WV:2,WI:8,WY:1};
const SEN_EM_DISPUTA=["AL","AK","AR","CO","DE","FL","GA","ID","IL","IA","KS","KY","LA","ME","MA","MI","MN","MS","MT","NE","NH","NJ","NM","NC","OH","OK","OR","RI","SC","SD","TN","TX","VA","WV","WY"];
const FORA_D=34,FORA_R=31,CD="#3D6BA8",CR="#B5473F",VAZIO="#E6E1D6";
let vista="senado",RES=null;const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hhmm=iso=>{const d=new Date(iso);return iso&&!isNaN(d)?d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}):""};
const pct=v=>v==null?"—":v.toLocaleString("en-US",{maximumFractionDigits:1})+"%";
const num=v=>v==null?"—":Math.round(v).toLocaleString("en-US");
function porEstado(){const S={},C={};for(const d of (RES&&RES.disputas)||[]){const o=d.casa==="senado"?S:C;(o[d.estado]=o[d.estado]||[]).push(d)}return{S,C}}
const conta=(L,p)=>L.filter(d=>d.chamada===p).length;
function casa(nome,D,R,tot){return`<div class="casa"><div class="lbl">${nome}</div><span class="n d">${D}</span> <span class="lbl">D</span> &nbsp; <span class="n r">${R}</span> <span class="lbl">R</span><div class="barra"><div style="width:${100*D/tot}%;background:${CD}"></div><div style="flex:1"></div><div style="width:${100*R/tot}%;background:${CR}"></div><div class="m"></div></div></div>`}
function bancada(){if(!RES){$("bancada").innerHTML="";return}const{S,C}=porEstado(),s=Object.values(S).flat(),c=Object.values(C).flat();
$("bancada").innerHTML=casa("Senate",FORA_D+conta(s,"D"),FORA_R+conta(s,"R"),100)+casa("House",conta(c,"D"),conta(c,"R"),435)}
function infoEstado(uf){const{S,C}=porEstado(),nome=TILES[uf][2];
if(vista==="senado"){if(!SEN_EM_DISPUTA.includes(uf))return{on:false,cor:"none",sub:"",dica:nome};const ds=S[uf]||[];
const ch=ds.map(d=>d.chamada);const cor=ch.includes("D")&&!ch.includes("R")?CD:ch.includes("R")&&!ch.includes("D")?CR:VAZIO;
return{on:true,cor,feito:cor!==VAZIO,sub:"",dica:ds.length?ds.map(d=>`${nome}${ds.length>1?" ("+d.disputa+")":""}: ${pct(d.pct_apurado)} · D ${num(d.votos_D)} · R ${num(d.votos_R)}${d.chamada?" · "+(d.chamada==="outro"?"Other":d.chamada)+" ✓":""}`).join(" | "):nome+": —"}}
const n=CADEIRAS[uf];if(n==null)return{on:false,cor:"none",sub:"",dica:nome};const ds=C[uf]||[],D=conta(ds,"D"),R=conta(ds,"R");
const ps=ds.map(d=>d.pct_apurado).filter(v=>v!=null),pm=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null;
return{on:true,cor:D+R===0?VAZIO:D>R?CD:R>D?CR:"#8A7F6E",feito:D+R>0,sub:D+R?`${D}–${R}`:String(n),dica:`${nome}: ${D} D · ${R} R / ${n} · ${pct(pm)}`}}
function mapa(){let h="";for(const uf in TILES){const[c,l]=TILES[uf],x=c*100,y=l*100,e=infoEstado(uf),t=e.feito?"#fff":e.on?"#22252A":"#8C8F94";
h+=`<g data-uf="${uf}" opacity="${e.on?1:.45}" style="cursor:pointer"><title>${esc(e.dica)}</title><rect x="${x}" y="${y}" width="94" height="94" rx="10" fill="${e.cor}" stroke="#C9C3B5" stroke-width="2"/><text x="${x+47}" y="${y+(e.sub?44:56)}" text-anchor="middle" font-size="30" fill="${t}">${uf}</text>${e.sub?`<text x="${x+47}" y="${y+74}" text-anchor="middle" font-size="20" fill="${t}">${esc(e.sub)}</text>`:""}</g>`}
h+=`<rect x="900" y="600" width="26" height="26" rx="5" fill="${CD}"/><text x="940" y="621" font-size="22" fill="#5E636B">D</text><rect x="900" y="640" width="26" height="26" rx="5" fill="${CR}"/><text x="940" y="661" font-size="22" fill="#5E636B">R</text>`;
$("mapa").innerHTML=h;$("mapa").querySelectorAll("g[data-uf]").forEach(g=>{const f=()=>$("dica").textContent=infoEstado(g.dataset.uf).dica;g.addEventListener("mouseenter",f);g.addEventListener("click",f)})}
function previsao(p){const el=$("previsao");if(!p||p.ativo!==true){el.style.display="none";return}el.style.display="";
const L=(n,c)=>c&&c.D!=null&&c.R!=null?`<p><b>${n}</b> <span class="d">${esc(c.D)} D</span> · <span class="r">${esc(c.R)} R</span>${Array.isArray(c.intervalo)&&c.intervalo.length===2?` (${esc(c.intervalo[0])}–${esc(c.intervalo[1])})`:""}</p>`:`<p><b>${n}</b> —</p>`;
el.innerHTML=`<div class="lbl">${esc(p.rotulo_modelo||"")}${hhmm(p.atualizado_em)?" · "+hhmm(p.atualizado_em):""}</div>${L("Senate",p.senado)}${L("House",p.camara)}`}
const RAW="https://raw.githubusercontent.com/alexrussianomendes-ctrl/eleicoes-ao-vivo-2026/dados/";
const LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)||location.protocol==="file:";
async function tenta(u){try{const r=await fetch(u+"?t="+Math.floor(Date.now()/60000),{cache:"no-store"});if(!r.ok)throw 0;return await r.json()}catch(e){return undefined}}
async function pega(n){for(const b of (LOCAL?["",RAW]:[RAW,""])){const j=await tenta(b+n);if(j!==undefined)return j}}
async function ciclo(){const r=await pega("resultados.json");if(r){RES=r;const h=hhmm(r.dados_da_fonte_em);$("hora").textContent=h?"Updated "+h:""}
const p=await pega("previsao.json");if(p!==undefined)previsao(p);bancada();mapa()}
const troca=v=>{vista=v;$("bs").className=v==="senado"?"on":"";$("bc").className=v==="camara"?"on":"";$("dica").textContent="";mapa()};
$("bs").onclick=()=>troca("senado");$("bc").onclick=()=>troca("camara");ciclo();setInterval(ciclo,30000);
</script></body></html>
